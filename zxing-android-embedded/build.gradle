apply plugin: 'com.android.library'

dependencies {
    api 'com.google.zxing:core:3.4.0'
    api 'androidx.legacy:legacy-support-v4:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:1.9.5'
}

android {
    namespace = 'com.google.zxing.client.android'
    resourcePrefix = 'zxing_'
    // Matches armcore (compileSdk 30). AGP 9 makes a library's compileSdk the minimum its consumers must compile
    // against; raise to 35 together with armcore's API 35 upgrade.
    compileSdk = 30

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res-orig', 'res']
            assets.srcDirs = ['assets']
        }
        test.setRoot('test')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        minSdk = 24
    }
}
